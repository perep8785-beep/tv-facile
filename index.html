<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <title>TV FACILE</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --yellow: #FFFF00;
      --black: #000000;
      --soft-yellow: #FFFDB0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-weight: 900;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 6px solid #FFFFFF;
      outline-offset: 4px;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    /* =========================
       HEADER / LOGO
       ========================= */

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;

      margin: 2px 0 22px;
      padding: 12px 6px;
    }

    .hero img {
      width: clamp(72px, 18vw, 108px);
      height: clamp(72px, 18vw, 108px);

      object-fit: contain;
      flex: 0 0 auto;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(44px, 11vw, 76px);
      line-height: 0.92;
      letter-spacing: -2px;
    }

    /* =========================
       HOME
       ========================= */

    .home-choices {
      display: grid;
      gap: 20px;
    }

    .channel {
      width: 100%;
      min-height: 150px;

      border: 8px solid var(--yellow);
      border-radius: 30px;

      background: var(--black);
      color: var(--yellow);

      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      text-align: left;
    }

    .channel-name {
      font-size: clamp(38px, 9vw, 62px);
      line-height: 1;
    }

    .channel-arrow {
      font-size: clamp(58px, 13vw, 84px);
      line-height: 0.7;
    }

    .channel:active,
    .nav-button:active,
    .watch-button:active,
    .thumbnail-button:active {
      transform: scale(0.985);
    }

    /* =========================
       CHANNEL VIEW
       ========================= */

    .nav-button {
      width: 100%;
      min-height: 90px;

      border: 7px solid var(--yellow);
      border-radius: 24px;

      background: var(--black);
      color: var(--yellow);

      padding: 12px 16px;

      font-size: clamp(28px, 7vw, 44px);
      font-weight: 900;
    }

    .screen-title {
      margin: 22px 0;

      text-align: center;

      font-size: clamp(42px, 10vw, 64px);
      line-height: 1;
    }

    .cards {
      display: grid;
      gap: 24px;
    }

    .card {
      overflow: hidden;

      border: 8px solid var(--yellow);
      border-radius: 30px;

      background: var(--black);
    }

    .thumbnail-button {
      display: block;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      padding: 0;

      border: 0;
      border-bottom: 7px solid var(--yellow);

      background: #050505;
      color: var(--yellow);
    }

    .thumbnail-button img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .thumbnail-fallback {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      text-align: center;

      font-size: clamp(27px, 7vw, 43px);
      line-height: 1.05;
    }

    .card-body {
      padding: 18px;
    }

    .card h3 {
      margin: 0 0 14px;

      font-size: clamp(34px, 8vw, 50px);
      line-height: 1.03;
    }

    .video-title {
      margin: 0 0 15px;

      color: var(--soft-yellow);

      font-size: clamp(18px, 4.5vw, 24px);
      line-height: 1.2;
    }

    .watch-button {
      width: 100%;
      min-height: 100px;

      border: 0;
      border-radius: 22px;

      background: var(--yellow);
      color: var(--black);

      padding: 14px;

      font-size: clamp(32px, 8vw, 48px);
      font-weight: 900;
    }

    .watch-button:disabled {
      border: 4px solid var(--yellow);

      background: #111111;
      color: var(--yellow);
    }

    /* =========================
       VIDEO PLAYER
       ========================= */

    .player {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;

      background: var(--black);

      padding:
        max(10px, env(safe-area-inset-top))
        10px
        max(10px, env(safe-area-inset-bottom));
    }

    .player-header {
      flex: 0 0 auto;
      padding-bottom: 10px;
    }

    .player-title {
      margin: 8px 0 0;

      text-align: center;

      font-size: clamp(24px, 6vw, 38px);
      line-height: 1.05;
    }

    .video-container {
      flex: 1;
      min-height: 0;
    }

    .video-container iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 5px solid var(--yellow);
      border-radius: 18px;

      background: var(--black);
    }

    @media (min-width: 760px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .home-choices {
        gap: 24px;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .app {
        width: min(100%, 1050px);
      }

      .hero {
        margin-bottom: 10px;
      }

      .hero img {
        width: 70px;
        height: 70px;
      }

      .hero h1 {
        font-size: 52px;
      }

      .channel {
        min-height: 105px;
      }

      .channel-name {
        font-size: 42px;
      }

      .player {
        padding: 8px;
      }

      .player-header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
      }

      .player-title {
        margin: 0;
        font-size: 28px;
      }

      .nav-button {
        min-height: 68px;
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="hero">
      <img src="icon-192.png" alt="">
      <h1>TV FACILE</h1>
    </header>

    <!-- HOME: EXACTLY THREE CHOICES -->
    <section
      id="home"
      class="home-choices"
      aria-label="Choisir une chaîne"
    >

      <button
        class="channel"
        type="button"
        data-section="EQUINOXE TV"
      >
        <span class="channel-name">ÉQUINOXE TV</span>
        <span class="channel-arrow" aria-hidden="true">›</span>
      </button>

      <button
        class="channel"
        type="button"
        data-section="CANAL 2"
      >
        <span class="channel-name">CANAL 2</span>
        <span class="channel-arrow" aria-hidden="true">›</span>
      </button>

      <button
        class="channel"
        type="button"
        data-section="INFO TV"
      >
        <span class="channel-name">INFO TV</span>
        <span class="channel-arrow" aria-hidden="true">›</span>
      </button>

    </section>

    <!-- PROGRAMS -->
    <section id="channelView" class="hidden">

      <button
        id="homeButton"
        class="nav-button"
        type="button"
      >
        ‹ ACCUEIL
      </button>

      <h2 id="channelTitle" class="screen-title">
        CHAÎNE
      </h2>

      <div id="cards" class="cards"></div>

    </section>

  </main>

  <!-- FULL-SCREEN IN-APP PLAYER -->
  <section
    id="player"
    class="player hidden"
    aria-label="Lecteur vidéo"
  >

    <div class="player-header">

      <button
        id="backButton"
        class="nav-button"
        type="button"
      >
        ‹ RETOUR AUX ÉMISSIONS
      </button>

      <div
        id="playerTitle"
        class="player-title"
      ></div>

    </div>

    <div class="video-container">

      <iframe
        id="videoFrame"
        title="Lecteur vidéo TV FACILE"
        src="about:blank"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>

    </div>

  </section>

  <script>
    (function () {
      "use strict";

      const PROGRAMS = [
        {
          id: "zenith1",
          section: "EQUINOXE TV",
          label: "LE ZÉNITH 1"
        },
        {
          id: "zenith2",
          section: "EQUINOXE TV",
          label: "LE ZÉNITH 2"
        },
        {
          id: "grandesunes",
          section: "EQUINOXE TV",
          label: "REVUE DES GRANDES UNES"
        },
        {
          id: "journal20",
          section: "EQUINOXE TV",
          label: "JOURNAL 20H"
        },
        {
          id: "debrief20",
          section: "EQUINOXE TV",
          label: "DÉBRIEF DU JOURNAL"
        },
        {
          id: "bilingue",
          section: "EQUINOXE TV",
          label: "JOURNAL BILINGUE"
        },
        {
          id: "droitreponse",
          section: "EQUINOXE TV",
          label: "DROIT DE RÉPONSE"
        },
        {
          id: "equinoxsoir",
          section: "EQUINOXE TV",
          label: "ÉQUINOXE SOIR"
        },
        {
          id: "pidginnews",
          section: "EQUINOXE TV",
          label: "PIDGIN NEWS"
        },
        {
          id: "pidgindebate",
          section: "EQUINOXE TV",
          label: "PIDGIN NEWS DEBATE"
        },

        {
          id: "canal2journal",
          section: "CANAL 2",
          label: "JOURNAL CANAL 2"
        },
        {
          id: "canal2debrief",
          section: "CANAL 2",
          label: "DÉBRIEF CANAL 2"
        },
        {
          id: "clubamis",
          section: "CANAL 2",
          label: "LE CLUB DES AMIS"
        },
        {
          id: "canalpress",
          section: "CANAL 2",
          label: "CANAL PRESSE"
        },
        {
          id: "clubelites",
          section: "CANAL 2",
          label: "LE CLUB DES ÉLITES"
        },

        {
          id: "infojournal",
          section: "INFO TV",
          label: "LE JOURNAL"
        },
        {
          id: "infodebrief",
          section: "INFO TV",
          label: "DÉBRIEF"
        }
      ];

      let data = {
        shows: PROGRAMS.map(program => ({
          ...program,
          found: false,
          videoId: "",
          thumbnail: "",
          embedUrl: "",
          watchUrl: "",
          videoTitle: "",
          publishedAt: ""
        }))
      };

      let currentSection = null;
      let wakeLock = null;

      const home =
        document.getElementById("home");

      const channelView =
        document.getElementById("channelView");

      const cards =
        document.getElementById("cards");

      const channelTitle =
        document.getElementById("channelTitle");

      const player =
        document.getElementById("player");

      const videoFrame =
        document.getElementById("videoFrame");

      const playerTitle =
        document.getElementById("playerTitle");

      function validData(value) {
        return (
          value &&
          Array.isArray(value.shows) &&
          value.shows.length >= PROGRAMS.length
        );
      }

      async function loadData() {
        try {
          const response = await fetch(
            "./data.json?v=" + Date.now(),
            {
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error(
              "HTTP " + response.status
            );
          }

          const freshData =
            await response.json();

          if (!validData(freshData)) {
            throw new Error(
              "Invalid data.json"
            );
          }

          data = freshData;

          localStorage.setItem(
            "tv-facile-data-v12",
            JSON.stringify(freshData)
          );
        }

        catch (error) {
          /*
            The app NEVER gets stuck.

            If network data cannot load,
            try the previous good version.
          */
          try {
            const cached =
              JSON.parse(
                localStorage.getItem(
                  "tv-facile-data-v12"
                ) || "null"
              );

            if (validData(cached)) {
              data = cached;
            }
          }

          catch (ignored) {
            // Keep built-in empty structure.
          }
        }

        if (currentSection) {
          renderChannel(
            currentSection
          );
        }
      }

      function showHome() {
        currentSection = null;

        channelView.classList.add(
          "hidden"
        );

        home.classList.remove(
          "hidden"
        );

        window.scrollTo(0, 0);
      }

      function showUnavailable(
        thumbnailButton,
        label
      ) {
        thumbnailButton.innerHTML = "";

        const fallback =
          document.createElement("div");

        fallback.className =
          "thumbnail-fallback";

        fallback.textContent =
          label +
          " — VIDÉO EN COURS DE MISE À JOUR";

        thumbnailButton.appendChild(
          fallback
        );
      }

      async function requestWakeLock() {
        if (
          !("wakeLock" in navigator) ||
          player.classList.contains("hidden")
        ) {
          return;
        }

        try {
          wakeLock =
            await navigator.wakeLock.request(
              "screen"
            );

          wakeLock.addEventListener(
            "release",
            function () {
              wakeLock = null;
            }
          );
        }

        catch (error) {
          /*
            Wake lock is an enhancement.
            Playback must still work without it.
          */
        }
      }

      function openPlayer(show) {
        if (
          !show ||
          !show.found ||
          !show.videoId
        ) {
          return;
        }

        playerTitle.textContent =
          show.label;

        videoFrame.src =
          show.embedUrl ||
          (
            "https://www.youtube-nocookie.com/embed/" +
            encodeURIComponent(
              show.videoId
            ) +
            "?autoplay=1&rel=0&playsinline=1"
          );

        player.classList.remove(
          "hidden"
        );

        document.body.style.overflow =
          "hidden";

        requestWakeLock();
      }

      async function closePlayer() {
        /*
          Clearing src actually stops playback.
        */
        videoFrame.src =
          "about:blank";

        player.classList.add(
          "hidden"
        );

        document.body.style.overflow =
          "";

        if (wakeLock) {
          try {
            await wakeLock.release();
          }

          catch (error) {
            // Ignore.
          }

          wakeLock = null;
        }
      }

      function renderChannel(section) {
        currentSection = section;

        channelTitle.textContent =
          section;

        cards.innerHTML = "";

        const programs =
          data.shows.filter(
            show =>
              show.section === section
          );

        programs.forEach(show => {
          const card =
            document.createElement(
              "article"
            );

          card.className = "card";

          /*
            THUMBNAIL BUTTON
          */

          const thumbnailButton =
            document.createElement(
              "button"
            );

          thumbnailButton.className =
            "thumbnail-button";

          thumbnailButton.type =
            "button";

          thumbnailButton.setAttribute(
            "aria-label",
            show.found
              ? "Regarder " + show.label
              : show.label
          );

          if (
            show.found &&
            show.thumbnail
          ) {
            const image =
              document.createElement(
                "img"
              );

            image.src =
              show.thumbnail;

            image.alt =
              "Dernière émission " +
              show.label;

            image.loading =
              "lazy";

            image.decoding =
              "async";

            image.onerror =
              function () {
                showUnavailable(
                  thumbnailButton,
                  show.label
                );
              };

            thumbnailButton.appendChild(
              image
            );

            thumbnailButton.onclick =
              function () {
                openPlayer(show);
              };
          }

          else {
            showUnavailable(
              thumbnailButton,
              show.label
            );

            thumbnailButton.disabled =
              true;
          }

          /*
            CARD TEXT
          */

          const body =
            document.createElement(
              "div"
            );

          body.className =
            "card-body";

          const heading =
            document.createElement(
              "h3"
            );

          heading.textContent =
            show.label;

          body.appendChild(
            heading
          );

          if (
            show.found &&
            show.videoTitle
          ) {
            const title =
              document.createElement(
                "p"
              );

            title.className =
              "video-title";

            title.textContent =
              show.videoTitle;

            body.appendChild(
              title
            );
          }

          /*
            HUGE WATCH BUTTON
          */

          const watch =
            document.createElement(
              "button"
            );

          watch.className =
            "watch-button";

          watch.type =
            "button";

          watch.textContent =
            show.found
              ? "▶ REGARDER"
              : "INDISPONIBLE";

          watch.disabled =
            !show.found;

          if (show.found) {
            watch.onclick =
              function () {
                openPlayer(show);
              };
          }

          body.appendChild(
            watch
          );

          card.appendChild(
            thumbnailButton
          );

          card.appendChild(
            body
          );

          cards.appendChild(
            card
          );
        });

        home.classList.add(
          "hidden"
        );

        channelView.classList.remove(
          "hidden"
        );

        window.scrollTo(0, 0);
      }

      document
        .querySelectorAll(".channel")
        .forEach(button => {

          button.addEventListener(
            "click",
            function () {
              renderChannel(
                button.dataset.section
              );
            }
          );
        });

      document
        .getElementById(
          "homeButton"
        )
        .addEventListener(
          "click",
          showHome
        );

      document
        .getElementById(
          "backButton"
        )
        .addEventListener(
          "click",
          closePlayer
        );

      /*
        Android/browser backgrounding can
        release the wake lock automatically.

        Re-request it when the app becomes
        visible while the player is open.
      */

      document.addEventListener(
        "visibilitychange",
        function () {

          if (
            document.visibilityState ===
              "visible" &&
            !player.classList.contains(
              "hidden"
            )
          ) {
            requestWakeLock();
          }
        }
      );

      window.addEventListener(
        "pagehide",
        function () {

          if (wakeLock) {
            try {
              wakeLock.release();
            }

            catch (error) {
              // Ignore.
            }
          }
        }
      );

      /*
        SERVICE WORKER
      */

      if (
        "serviceWorker" in navigator
      ) {
        navigator.serviceWorker
          .register(
            "./service-worker.js?v=12",
            {
              updateViaCache: "none"
            }
          )
          .catch(function () {
            // App still works without PWA support.
          });
      }

      /*
        Home appears IMMEDIATELY.

        Data loads afterwards.
        No loading screen.
      */

      loadData();

    })();
  </script>

</body>
</html>
