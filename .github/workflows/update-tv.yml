              # ========================================================
              # CANAL 2
              # ========================================================

              {
                  "id": "canal2journal",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "JOURNAL CANAL 2",

                  "patterns": [
                      r"\bJOURNAL\b.*\b19H50\b",
