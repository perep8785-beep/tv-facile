name: Update TV Facile

# Finds the newest episode of every programme and commits data.json.
# The logic lives in scripts/update_tv.py so it can be run locally too.
# Optional: add a YT_API_KEY repository secret (YouTube Data API v3) for
# exact dates and durations; without it the public channel pages are used.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-tv.yml"
      - "scripts/update_tv.py"

permissions:
  contents: write

concurrency:
  group: tv-facile-update
  cancel-in-progress: false

jobs:
  update:
    name: Update latest TV episodes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find the latest episodes
        id: update
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set +e
          python scripts/update_tv.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json is already current."
            exit 0
          fi

          git config user.name "tv-facile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git commit -m "Update TV Facile episodes"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when most programmes are missing
        if: steps.update.outputs.code != '0'
        run: |
          echo "Fewer than half of the programmes were found."
          echo "YouTube has probably changed its pages: check scripts/update_tv.py."
          exit 1
