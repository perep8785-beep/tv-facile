name: Update TV Facile

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-tv.yml"

permissions:
  contents: write

concurrency:
  group: tv-facile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --quiet \
            yt-dlp

      - name: Find latest official episodes
        shell: bash

        run: |
          python <<'PY'

          import datetime
