                  "query":
                      "LE CLUB DES ELITES CANAL 2 INTERNATIONAL"
              },


              # ========================================================
              # INFO TV
              # ========================================================

              {
                  "id": "infojournal",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "LE JOURNAL",

                  "patterns": [
                      r"\bLE 20H00\b",
                      r"\bLE 20H\b",
                      r"\bJOURNAL 20H\b",
                      r"\bLE JOURNAL\b"
                  ],

                  "query":
                      "LE 20H INFO TV CAMEROUN"
              },

              {
                  "id": "infodebrief",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "DÉBRIEF",

                  "patterns": [
