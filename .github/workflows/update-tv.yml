name: Update TV Facile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-tv.yml"

permissions:
  contents: write

concurrency:
  group: tv-facile-update
  cancel-in-progress: false

jobs:
  update:
    name: Update latest TV episodes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TV Facile data
        shell: bash
        run: |
          python <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import re
          import unicodedata
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET


          # ============================================================
          # OFFICIAL CHANNELS
          #
          # These IDs were resolved from the official YouTube handles.
          # The updater re-checks the handle when possible.
          # ============================================================

          CHANNELS = {
              "equinoxe": {
                  "section": "EQUINOXE TV",
                  "name": "ÉQUINOXE TV",
                  "handle": "@equinoxetv",
                  "channelId": "UCXriNfPc0bkHIp0G9YTwYEw",
              },
              "canal2": {
