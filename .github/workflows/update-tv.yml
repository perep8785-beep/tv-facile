name: Update TV Facile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-tv.yml"

permissions:
  contents: write

concurrency:
  group: tv-facile-update
  cancel-in-progress: false

jobs:
  update:
    name: Update latest TV episodes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --disable-pip-version-check --quiet --upgrade yt-dlp

      - name: Update TV Facile data
        shell: bash
        run: |
          python <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import unicodedata
          import urllib.request
          import xml.etree.ElementTree as ET

          from yt_dlp import YoutubeDL


          CHANNELS = {
              "equinoxe": {
                  "section": "EQUINOXE TV",
                  "name": "ÉQUINOXE TV",
                  "handle": "@equinoxetv",
              },
              "canal2": {
                  "section": "CANAL 2",
                  "name": "Canal2 International",
                  "handle": "@canal2internationalofficiel",
              },
              "infotv": {
                  "section": "INFO TV",
                  "name": "Info TV Officiel",
                  "handle": "@InfoTV_Cameroun",
              },
          }


          SHOWS = [
              {
                  "id": "zenith1",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "LE ZÉNITH 1",
                  "patterns": [
                      r"\b10 12\b.*\bZENITH\b.*\bPART(?:IE)? 1\b",
                      r"\bZENITH\b.*\bPART(?:IE)? 1\b",
                      r"\bZENITH 1\b",
                  ],
                  "exclude": [r"\bPART(?:IE)? 2\b"],
                  "query": "LE ZENITH PARTIE 1 EQUINOXE TV",
              },
              {
                  "id": "zenith2",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "LE ZÉNITH 2",
                  "patterns": [
                      r"\b10 12\b.*\bZENITH\b.*\bPART(?:IE)? 2\b",
                      r"\bZENITH\b.*\bPART(?:IE)? 2\b",
                      r"\bZENITH 2\b",
                  ],
                  "exclude": [r"\bPART(?:IE)? 1\b"],
                  "query": "LE ZENITH PARTIE 2 EQUINOXE TV",
              },
              {
                  "id": "grandesunes",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "REVUE DES GRANDES UNES",
                  "patterns": [
                      r"\bREVUE DES GRANDES UNES\b",
                      r"\bGRANDES UNES\b",
                  ],
                  "query": "REVUE DES GRANDES UNES EQUINOXE TV",
              },
              {
                  "id": "journal20",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "JOURNAL 20H",
                  "patterns": [
                      r"\bJOURNAL 20H\b",
                      r"\bJOURNAL DE 20H\b",
                      r"\b20H\b.*\bJOURNAL\b",
                  ],
                  "exclude": [r"\bDEBRIEF\b"],
                  "query": "JOURNAL 20H EQUINOXE TV",
              },
              {
                  "id": "debrief20",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "DÉBRIEF DU JOURNAL",
                  "patterns": [
                      r"\bDEBRIEF\b.*\bJOURNAL\b",
                      r"\bJOURNAL\b.*\bDEBRIEF\b",
                  ],
                  "query": "DEBRIEF DU JOURNAL EQUINOXE TV",
              },
              {
                  "id": "bilingue",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "JOURNAL BILINGUE",
                  "patterns": [
                      r"\bJOURNAL BILINGUE\b",
                      r"\bJTB\b",
                  ],
                  "query": "JOURNAL BILINGUE EQUINOXE TV",
              },
              {
                  "id": "droitreponse",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "DROIT DE RÉPONSE",
                  "patterns": [r"\bDROIT DE REPONSE\b"],
                  "query": "DROIT DE REPONSE EQUINOXE TV",
              },
              {
                  "id": "equinoxsoir",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "ÉQUINOXE SOIR",
                  "patterns": [r"\bEQUINOXE SOIR\b"],
                  "query": "EQUINOXE SOIR",
              },
              {
                  "id": "pidginnews",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "PIDGIN NEWS",
                  "patterns": [r"\bPIDGIN NEWS\b"],
                  "exclude": [r"\bDEBATE\b"],
                  "query": "PIDGIN NEWS EQUINOXE TV",
              },
              {
                  "id": "pidgindebate",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "PIDGIN NEWS DEBATE",
                  "patterns": [
                      r"\bPIDGIN NEWS DEBATE\b",
                      r"\bPIDGIN\b.*\bDEBATE\b",
                  ],
                  "query": "PIDGIN NEWS DEBATE EQUINOXE TV",
              },
              {
                  "id": "canal2journal",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "JOURNAL CANAL 2",
                  "patterns": [
                      r"\bJOURNAL\b.*\b19H50\b",
                      r"\b19H50\b.*\bJOURNAL\b",
                      r"\bJOURNAL TELEVISE\b",
                      r"\bLE JOURNAL\b",
                  ],
                  "exclude": [r"\bDEBRIEF\b"],
                  "query": "LE JOURNAL 19H50 CANAL 2 INTERNATIONAL",
              },
              {
                  "id": "canal2debrief",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "DÉBRIEF CANAL 2",
                  "patterns": [r"\bDEBRIEF\b"],
                  "query": "DEBRIEF CANAL 2 INTERNATIONAL",
              },
              {
                  "id": "clubamis",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "LE CLUB DES AMIS",
                  "patterns": [r"\bCLUB DES AMIS\b"],
                  "query": "LE CLUB DES AMIS CANAL 2 INTERNATIONAL",
              },
              {
                  "id": "canalpress",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "CANAL PRESSE",
                  "patterns": [r"\bCANAL PRESSE\b"],
                  "query": "CANAL PRESSE CANAL 2 INTERNATIONAL",
              },
              {
                  "id": "clubelites",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "LE CLUB DES ÉLITES",
                  "patterns": [
                      r"\bCLUB DES ELITES\b",
                      r"\bCLUB D ELITES\b",
                      r"\bCLUB DE L ELITE\b",
                  ],
                  "query": "LE CLUB DES ELITES CANAL 2 INTERNATIONAL",
              },
              {
                  "id": "infojournal",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "LE JOURNAL",
                  "patterns": [
                      r"\bLE 20H00\b",
                      r"\bLE 20H\b",
                      r"\bJOURNAL 20H\b",
                      r"\bLE JOURNAL\b",
                  ],
                  "exclude": [r"\bDEBRIEF\b"],
                  "query": "LE 20H INFO TV CAMEROUN",
              },
              {
                  "id": "infodebrief",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "DÉBRIEF",
                  "patterns": [r"\bDEBRIEF\b"],
                  "query": "DEBRIEF INFO TV CAMEROUN",
              },
          ]


          YDL_BASE = {
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
              "ignoreerrors": True,
              "socket_timeout": 30,
          }


          def normalize(text):
              text = unicodedata.normalize("NFKD", text or "")
              text = "".join(
                  ch for ch in text
                  if not unicodedata.combining(ch)
              )
              text = (
                  text.upper()
                  .replace("’", "'")
                  .replace("‘", "'")
                  .replace("–", "-")
                  .replace("—", "-")
              )
              text = re.sub(r"[^A-Z0-9]+", " ", text)
              return re.sub(r"\s+", " ", text).strip()


          def http_text(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 TV-Facile-GitHub-Updater"
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8", "replace")


          def ydl_extract(url, flat=False, playlist_end=None):
              options = dict(YDL_BASE)
              if flat:
                  options["extract_flat"] = "in_playlist"
              if playlist_end:
                  options["playlistend"] = playlist_end

              with YoutubeDL(options) as ydl:
                  return ydl.extract_info(url, download=False)


          def resolve_channel_id(handle):
              """
              Resolve the official channel ID from the channel handle itself.
              First use yt-dlp; if that fails, inspect the official handle page.
              """
              url = f"https://www.youtube.com/{handle}/videos"

              try:
                  info = ydl_extract(url, flat=True, playlist_end=1)
                  if info:
                      channel_id = (
                          info.get("channel_id")
                          or info.get("uploader_id")
                          or ""
                      )
                      if str(channel_id).startswith("UC"):
                          return channel_id
              except Exception as error:
                  print("yt-dlp handle resolution warning:", handle, error)

              html = http_text(f"https://www.youtube.com/{handle}")

              for pattern in (
                  r'"channelId":"(UC[A-Za-z0-9_-]{22})"',
                  r'"externalId":"(UC[A-Za-z0-9_-]{22})"',
                  r'"browseId":"(UC[A-Za-z0-9_-]{22})"',
              ):
                  match = re.search(pattern, html)
                  if match:
                      return match.group(1)

              raise RuntimeError(
                  f"Could not resolve official channel ID for {handle}"
              )


          def rss_entries(channel_id):
              """
              Official YouTube Atom feed.
              It is checked before channel scraping/search.
              """
              url = (
                  "https://www.youtube.com/feeds/videos.xml"
                  f"?channel_id={channel_id}"
              )

              xml = http_text(url)
              root = ET.fromstring(xml)

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015",
              }

              entries = []

              for entry in root.findall("atom:entry", ns):
                  video_id = (
                      entry.findtext(
                          "yt:videoId",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  title = (
                      entry.findtext(
                          "atom:title",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  published = (
                      entry.findtext(
                          "atom:published",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  if video_id:
                      entries.append(
                          {
                              "id": video_id,
                              "title": title,
                              "publishedAt": published,
                              "channelId": channel_id,
                              "source": "rss",
                          }
                      )

              return entries


          def channel_entries(channel_id, tab):
              """
              Scan the official channel's videos or past livestreams.
              """
              url = (
                  f"https://www.youtube.com/channel/{channel_id}/{tab}"
              )

              try:
                  data = ydl_extract(
                      url,
                      flat=True,
                      playlist_end=600,
                  )
              except Exception as error:
                  print("Channel scan warning:", url, error)
                  return []

              if not data:
                  return []

              output = []

              for item in data.get("entries") or []:
                  if not item:
                      continue

                  video_id = item.get("id") or ""
                  if not video_id:
                      continue

                  output.append(
                      {
                          "id": video_id,
                          "title": item.get("title") or "",
                          "publishedAt": "",
                          "channelId": (
                              item.get("channel_id")
                              or channel_id
                          ),
                          "source": tab,
                      }
                  )

              return output


          def search_official_channel(query, official_channel_id):
              """
              Last-resort YouTube search.
              Results still have to be verified against the official channel.
              """
              try:
                  data = ydl_extract(
                      "ytsearch40:" + query,
                      flat=True,
                  )
              except Exception as error:
                  print("Search warning:", query, error)
                  return []

              if not data:
                  return []

              output = []

              for item in data.get("entries") or []:
                  if not item:
                      continue

                  video_id = item.get("id") or ""
                  if not video_id:
                      continue

                  output.append(
                      {
                          "id": video_id,
                          "title": item.get("title") or "",
                          "publishedAt": "",
                          "channelId": (
                              item.get("channel_id")
                              or item.get("uploader_id")
                              or ""
                          ),
                          "expectedChannelId": official_channel_id,
                          "source": "search",
                      }
                  )

              return output


          def title_matches(show, title):
              title = normalize(title)

              for pattern in show.get("exclude", []):
                  if re.search(pattern, title):
                      return False

              return any(
                  re.search(pattern, title)
                  for pattern in show["patterns"]
              )


          def matching_entries(show, entries, limit=8):
              output = []
              seen = set()

              for entry in entries:
                  video_id = entry.get("id") or ""

                  if not video_id or video_id in seen:
                      continue

                  seen.add(video_id)

                  if title_matches(show, entry.get("title", "")):
                      output.append(entry)

                  if len(output) >= limit:
                      break

              return output


          def full_video_metadata(video_id, official_channel_id):
              """
              Verify the exact video belongs to the official channel,
              then return its real title/date.
              """
              try:
                  info = ydl_extract(
                      "https://www.youtube.com/watch?v=" + video_id,
                      flat=False,
                  )
              except Exception as error:
                  print("Metadata warning:", video_id, error)
                  return None

              if not info:
                  return None

              actual_channel_id = (
                  info.get("channel_id")
                  or info.get("uploader_id")
                  or ""
              )

              if actual_channel_id != official_channel_id:
                  print(
                      "Rejected non-official result:",
                      video_id,
                      actual_channel_id,
                  )
                  return None

              title = info.get("title") or ""

              timestamp = (
                  info.get("timestamp")
                  or info.get("release_timestamp")
              )

              published_at = ""

              if timestamp:
                  published_at = (
                      dt.datetime.fromtimestamp(
                          timestamp,
                          tz=dt.timezone.utc,
                      )
                      .isoformat()
                      .replace("+00:00", "Z")
                  )
              else:
                  upload_date = info.get("upload_date") or ""
                  if len(upload_date) == 8:
                      published_at = (
                          f"{upload_date[0:4]}-"
                          f"{upload_date[4:6]}-"
                          f"{upload_date[6:8]}T00:00:00Z"
                      )

              return {
                  "id": video_id,
                  "title": title,
                  "publishedAt": published_at,
                  "channelId": actual_channel_id,
              }


          def parse_date(value):
              if not value:
                  return dt.datetime.min.replace(
                      tzinfo=dt.timezone.utc
                  )

              try:
                  parsed = dt.datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(
                          tzinfo=dt.timezone.utc
                      )

                  return parsed
              except Exception:
                  return dt.datetime.min.replace(
                      tzinfo=dt.timezone.utc
                  )


          def build_show(show, metadata):
              video_id = metadata["id"]

              return {
                  "id": show["id"],
                  "section": show["section"],
                  "label": show["label"],
                  "found": True,
                  "videoId": video_id,
                  "thumbnail": (
                      "https://i.ytimg.com/vi/"
                      f"{video_id}/hqdefault.jpg"
                  ),
                  "embedUrl": (
                      "https://www.youtube-nocookie.com/embed/"
                      f"{video_id}?autoplay=1&rel=0&playsinline=1"
                  ),
                  "watchUrl": (
                      "https://www.youtube.com/watch?v="
                      + video_id
                  ),
                  "videoTitle": metadata.get("title", ""),
                  "publishedAt": metadata.get("publishedAt", ""),
              }


          # --------------------------------------------------------
          # Load previous known-good data.
          # --------------------------------------------------------

          try:
              with open("data.json", "r", encoding="utf-8") as file:
                  previous_data = json.load(file)
          except Exception:
              previous_data = {"shows": []}


          previous_by_id = {
              item.get("id"): item
              for item in previous_data.get("shows", [])
              if item.get("id")
          }


          # --------------------------------------------------------
          # Resolve official channels and collect recent uploads.
          # --------------------------------------------------------

          resolved = {}
          rss_cache = {}
          videos_cache = {}
          streams_cache = {}


          for key, channel in CHANNELS.items():
              print()
              print("=" * 72)
              print("CHANNEL:", channel["name"])
              print("HANDLE:", channel["handle"])

              channel_id = resolve_channel_id(
                  channel["handle"]
              )

              resolved[key] = channel_id

              print("CHANNEL ID:", channel_id)

              try:
                  rss_cache[key] = rss_entries(channel_id)
              except Exception as error:
                  print("RSS warning:", error)
                  rss_cache[key] = []

              videos_cache[key] = channel_entries(
                  channel_id,
                  "videos",
              )

              streams_cache[key] = channel_entries(
                  channel_id,
                  "streams",
              )

              print("RSS:", len(rss_cache[key]))
              print("VIDEOS:", len(videos_cache[key]))
              print("STREAMS:", len(streams_cache[key]))


          # --------------------------------------------------------
          # Match each requested program.
          # --------------------------------------------------------

          final_shows = []


          for show in SHOWS:
              print()
              print("-" * 72)
              print("PROGRAM:", show["label"])

              channel_key = show["channel"]
              official_channel_id = resolved[channel_key]

              candidates = []

              candidates.extend(
                  matching_entries(
                      show,
                      rss_cache[channel_key],
                      limit=8,
                  )
              )

              candidates.extend(
                  matching_entries(
                      show,
                      videos_cache[channel_key],
                      limit=8,
                  )
              )

              candidates.extend(
                  matching_entries(
                      show,
                      streams_cache[channel_key],
                      limit=8,
                  )
              )

              # De-duplicate before metadata verification.
              unique = []
              seen = set()

              for candidate in candidates:
                  video_id = candidate.get("id") or ""
                  if not video_id or video_id in seen:
                      continue

                  seen.add(video_id)
                  unique.append(candidate)


              # Search fallback if direct official-channel scanning
              # did not find a title match.
              if not unique:
                  searched = search_official_channel(
                      show["query"],
                      official_channel_id,
                  )

                  searched = matching_entries(
                      show,
                      searched,
                      limit=10,
                  )

                  for candidate in searched:
                      video_id = candidate.get("id") or ""
                      if video_id and video_id not in seen:
                          seen.add(video_id)
                          unique.append(candidate)


              verified = []

              for candidate in unique[:16]:
                  metadata = full_video_metadata(
                      candidate["id"],
                      official_channel_id,
                  )

                  if not metadata:
                      continue

                  # Use the complete title returned by the video itself.
                  if not title_matches(
                      show,
                      metadata.get("title", ""),
                  ):
                      continue

                  verified.append(metadata)


              newest = None

              if verified:
                  newest = max(
                      verified,
                      key=lambda item: parse_date(
                          item.get("publishedAt", "")
                      ),
                  )


              previous = previous_by_id.get(
                  show["id"],
                  {},
              )

              previous_valid = (
                  previous.get("found") is True
                  and bool(previous.get("videoId"))
              )


              # If an older search result was found, preserve the
              # previously known newer episode.
              if newest and previous_valid:
                  previous_date = parse_date(
                      previous.get("publishedAt", "")
                  )

                  newest_date = parse_date(
                      newest.get("publishedAt", "")
                  )

                  if previous_date > newest_date:
                      kept = dict(previous)
                      kept["section"] = show["section"]
                      kept["label"] = show["label"]

                      final_shows.append(kept)

                      print(
                          "KEEP PREVIOUS:",
                          kept.get("videoId"),
                          kept.get("videoTitle", ""),
                      )
                      continue


              if newest:
                  entry = build_show(show, newest)
                  final_shows.append(entry)

                  print(
                      "FOUND:",
                      entry["videoId"],
                      entry["videoTitle"],
                  )
                  continue


              # Requirement: if nothing newer is found, never destroy
              # the previous valid episode.
              if previous_valid:
                  kept = dict(previous)
                  kept["section"] = show["section"]
                  kept["label"] = show["label"]

                  final_shows.append(kept)

                  print(
                      "NO NEW MATCH - PRESERVED:",
                      kept.get("videoId"),
                  )
                  continue


              # First run and no matching episode yet.
              final_shows.append(
                  {
                      "id": show["id"],
                      "section": show["section"],
                      "label": show["label"],
                      "found": False,
                      "videoId": "",
                      "thumbnail": "",
                      "embedUrl": "",
                      "watchUrl": "",
                      "videoTitle": "",
                      "publishedAt": "",
                  }
              )

              print("NO EPISODE FOUND YET")


          # --------------------------------------------------------
          # Save.
          # --------------------------------------------------------

          output = {
              "generatedAt": (
                  dt.datetime.now(dt.timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "channels": {
                  "EQUINOXE TV": {
                      "name": CHANNELS["equinoxe"]["name"],
                      "handle": CHANNELS["equinoxe"]["handle"],
                      "channelId": resolved["equinoxe"],
                  },
                  "CANAL 2": {
                      "name": CHANNELS["canal2"]["name"],
                      "handle": CHANNELS["canal2"]["handle"],
                      "channelId": resolved["canal2"],
                  },
                  "INFO TV": {
                      "name": CHANNELS["infotv"]["name"],
                      "handle": CHANNELS["infotv"]["handle"],
                      "channelId": resolved["infotv"],
                  },
              },
              "shows": final_shows,
          }


          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )
              file.write("\n")


          found_count = sum(
              1
              for item in final_shows
              if item.get("found")
          )

          print()
          print("=" * 72)
          print(
              f"TV FACILE UPDATE COMPLETE: "
              f"{found_count}/{len(final_shows)} programs available"
          )
          PY

      - name: Validate data.json
        shell: bash
        run: |
          python <<'PY'
          import json
          import re

          with open("data.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          shows = data.get("shows", [])

          if len(shows) != 17:
              raise SystemExit(
                  f"Expected 17 programs, found {len(shows)}"
              )

          ids = set()

          for show in shows:
              show_id = show.get("id") or ""

              if not show_id or show_id in ids:
                  raise SystemExit(
                      f"Invalid or duplicate show ID: {show_id!r}"
                  )

              ids.add(show_id)

              if not show.get("found"):
                  continue

              video_id = show.get("videoId") or ""

              if not re.fullmatch(
                  r"[A-Za-z0-9_-]{11}",
                  video_id,
              ):
                  raise SystemExit(
                      f"Invalid video ID for {show_id}: {video_id}"
                  )

              expected_thumbnail = (
                  "https://i.ytimg.com/vi/"
                  f"{video_id}/hqdefault.jpg"
              )

              if show.get("thumbnail") != expected_thumbnail:
                  raise SystemExit(
                      f"Invalid thumbnail for {show_id}"
                  )

              embed = show.get("embedUrl") or ""

              if not embed.startswith(
                  "https://www.youtube-nocookie.com/embed/"
                  + video_id
              ):
                  raise SystemExit(
                      f"Invalid embed URL for {show_id}"
                  )

              watch = show.get("watchUrl") or ""

              if watch != (
                  "https://www.youtube.com/watch?v="
                  + video_id
              ):
                  raise SystemExit(
                      f"Invalid watch URL for {show_id}"
                  )

          found = sum(
              1 for show in shows
              if show.get("found")
          )

          print(f"Validated {found}/17 available programs.")
          PY

      - name: Print episode summary
        shell: bash
        run: |
          python <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          for show in data["shows"]:
              status = "OK" if show["found"] else "MISSING"

              print(
                  f'{status:7} | '
                  f'{show["section"]:11} | '
                  f'{show["label"]:25} | '
                  f'{show["videoId"]:11} | '
                  f'{show["videoTitle"]}'
              )
          PY

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json is already current."
            exit 0
          fi

          git config user.name "tv-facile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json
          git commit -m "Update TV Facile episodes"

          # A scheduled run can overlap with a manual edit.
          # Rebase once before pushing so a harmless remote commit
          # does not make the updater fail unnecessarily.
          git pull --rebase origin main
          git push origin HEAD:main
