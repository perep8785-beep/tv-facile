              },
              "infotv": {
                  "section": "INFO TV",
                  "name": "Info TV Officiel",
                  "handle": "@InfoTV_Cameroun",
                  "channelId": "UCNngJARC3eIXpUwAXfCJO5A",
              },
          }


          # ============================================================
          # PROGRAMS
          #
          # Multiple search phrases are intentional. TV channels are not
          # always consistent about accents, punctuation, spaces or names.
          # ============================================================

          SHOWS = [
              {
                  "id": "zenith1",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "LE ZÉNITH 1",
                  "queries": [
                      "10 12 LE ZENITH PART1",
                      "10 12 LE ZENITH PARTIE 1",
                      "LE ZENITH PART1",
                  ],
                  "patterns": [
                      r"\b10\s*12\b.*\bZENITH\b.*\bPART(?:IE)?\s*1\b",
                      r"\bZENITH\b.*\bPART(?:IE)?\s*1\b",
                  ],
                  "exclude": [
                      r"\bPART(?:IE)?\s*2\b",
                  ],
              },
              {
                  "id": "zenith2",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "LE ZÉNITH 2",
                  "queries": [
                      "10 12 LE ZENITH PART2",
                      "10 12 LE ZENITH PARTIE 2",
                      "LE ZENITH PART2",
                  ],
                  "patterns": [
                      r"\b10\s*12\b.*\bZENITH\b.*\bPART(?:IE)?\s*2\b",
                      r"\bZENITH\b.*\bPART(?:IE)?\s*2\b",
                  ],
                  "exclude": [
                      r"\bPART(?:IE)?\s*1\b",
                  ],
              },
              {
                  "id": "grandesunes",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "REVUE DES GRANDES UNES",
                  "queries": [
                      "REVUE DES GRANDES UNES",
                      "LA REVUE DES GRANDES UNES",
                  ],
                  "patterns": [
                      r"\b(?:LA\s+)?REVUE DES GRANDES UNES\b",
                      r"\bGRANDES UNES\b",
                  ],
              },
              {
                  "id": "journal20",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "JOURNAL 20H",
                  "queries": [
                      "JOURNAL 20H",
                      "JOURNAL DE 20H",
                  ],
                  "patterns": [
                      r"\bJOURNAL\b.*\b20H(?:00)?\b",
                      r"\b20H(?:00)?\b.*\bJOURNAL\b",
                  ],
                  "exclude": [
                      r"\bDEBRIEF\b",
                  ],
              },
              {
                  "id": "debrief20",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "DÉBRIEF DU JOURNAL",
                  "queries": [
                      "DEBRIEF JOURNAL 20H",
                      "DEBRIEF DU JOURNAL",
                      "JOURNAL 20H DEBRIEF",
                  ],
                  "patterns": [
                      r"\bDEBRIEF\b.*\bJOURNAL\b",
                      r"\bJOURNAL\b.*\bDEBRIEF\b",
                  ],
              },
              {
                  "id": "bilingue",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "JOURNAL BILINGUE",
                  "queries": [
                      "JOURNAL BILINGUE",
                      "JTB",
                  ],
                  "patterns": [
                      r"\bJOURNAL BILINGUE\b",
                      r"\bJTB\b",
                  ],
              },
              {
                  "id": "droitreponse",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "DROIT DE RÉPONSE",
                  "queries": [
                      "DROIT DE REPONSE",
                  ],
                  "patterns": [
                      r"\bDROIT DE REPONSE\b",
                  ],
              },
              {
                  "id": "equinoxsoir",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "ÉQUINOXE SOIR",
                  "queries": [
                      "EQUINOXE SOIR",
                  ],
                  "patterns": [
                      r"\bEQUINOXE SOIR\b",
                  ],
              },
              {
                  "id": "pidginnews",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "PIDGIN NEWS",
                  "queries": [
                      "PIDGIN NEWS",
                  ],
                  "patterns": [
                      r"\bPIDGIN NEWS\b",
                  ],
                  "exclude": [
                      r"\bDEBATE\b",
                  ],
              },
              {
                  "id": "pidgindebate",
                  "channel": "equinoxe",
                  "section": "EQUINOXE TV",
                  "label": "PIDGIN NEWS DEBATE",
                  "queries": [
                      "PIDGIN NEWS DEBATE",
                  ],
                  "patterns": [
                      r"\bPIDGIN NEWS DEBATE\b",
                      r"\bPIDGIN\b.*\bDEBATE\b",
                  ],
              },

              {
                  "id": "canal2journal",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "JOURNAL CANAL 2",
                  "queries": [
                      "JOURNAL 19H50",
                      "LE JOURNAL 19H50",
                      "JOURNAL TELEVISE 19H50",
                  ],
                  "patterns": [
                      r"\bJOURNAL\b.*\b19H\s*50\b",
                      r"\b19H\s*50\b.*\bJOURNAL\b",
                      r"\bJOURNAL TELEVISE\b",
                  ],
                  "exclude": [
                      r"\bDEBRIEF\b",
                  ],
              },
              {
                  "id": "canal2debrief",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "DÉBRIEF CANAL 2",
                  "queries": [
                      "DEBRIEF DE L ACTU",
                      "DEBRIEF",
                  ],
                  "patterns": [
                      r"\bDEBRIEF\b",
                  ],
              },
              {
                  "id": "clubamis",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "LE CLUB DES AMIS",
                  "queries": [
                      "LE CLUB DES AMIS",
                      "CLUB DES AMIS",
                  ],
                  "patterns": [
                      r"\bCLUB DES AMIS\b",
                  ],
              },
              {
                  "id": "canalpress",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "CANAL PRESSE",
                  "queries": [
                      "CANAL PRESSE",
                  ],
                  "patterns": [
                      r"\bCANAL PRESSE\b",
                  ],
              },
              {
                  "id": "clubelites",
                  "channel": "canal2",
                  "section": "CANAL 2",
                  "label": "LE CLUB DES ÉLITES",
                  "queries": [
                      "LE CLUB DES ELITES",
                      "CLUB DES ELITES",
                      "CLUB DE L ELITE",
                  ],
                  "patterns": [
                      r"\bCLUB DES ELITES\b",
                      r"\bCLUB D ELITES\b",
                      r"\bCLUB DE L ELITE\b",
                  ],
              },

              {
                  "id": "infojournal",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "LE JOURNAL",
                  "queries": [
                      "LE 20H",
                      "LE 20H00",
                      "JOURNAL 20H",
                  ],
                  "patterns": [
                      r"\bLE 20H(?:00)?\b",
                      r"\bJOURNAL\b.*\b20H(?:00)?\b",
                      r"\b20H(?:00)?\b.*\bJOURNAL\b",
                  ],
                  "exclude": [
                      r"\bDEBRIEF\b",
                  ],
              },
              {
                  "id": "infodebrief",
                  "channel": "infotv",
                  "section": "INFO TV",
                  "label": "DÉBRIEF",
                  "queries": [
                      "DEBRIEF",
                      "DEBRIEF DU JOURNAL",
                  ],
                  "patterns": [
                      r"\bDEBRIEF\b",
                  ],
              },
          ]


          # ============================================================
          # HTTP
          # ============================================================

          USER_AGENT = (
              "Mozilla/5.0 (Linux; Android 14) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0.0.0 Mobile Safari/537.36"
          )


          def http_text(url, timeout=25):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept-Language": "en-US,en;q=0.9",
                      "Accept": (
                          "text/html,application/xhtml+xml,"
                          "application/xml;q=0.9,*/*;q=0.8"
                      ),
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout,
              ) as response:
                  return response.read().decode(
                      "utf-8",
                      "replace",
                  )


          # ============================================================
          # NORMALIZATION
          # ============================================================

          def normalize(text):
              text = html.unescape(text or "")

              text = unicodedata.normalize(
                  "NFKD",
                  text,
              )

              text = "".join(
                  ch
                  for ch in text
                  if not unicodedata.combining(ch)
              )

              text = (
                  text.upper()
                  .replace("’", "'")
                  .replace("‘", "'")
                  .replace("–", "-")
                  .replace("—", "-")
              )

              text = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  text,
              )

              return re.sub(
                  r"\s+",
                  " ",
                  text,
              ).strip()


          def title_matches(show, title):
              value = normalize(title)

              for pattern in show.get(
                  "exclude",
                  [],
              ):
                  if re.search(
                      pattern,
                      value,
                  ):
                      return False

              return any(
                  re.search(
                      pattern,
                      value,
                  )
                  for pattern
                  in show["patterns"]
              )


          # ============================================================
          # JSON EMBEDDED IN YOUTUBE HTML
          # ============================================================

          def extract_json_assignment(page, marker):
              start = page.find(marker)

              if start < 0:
                  return None

              start += len(marker)

              while (
                  start < len(page)
                  and page[start].isspace()
              ):
                  start += 1

              if (
                  start >= len(page)
                  or page[start] != "{"
              ):
                  brace = page.find(
                      "{",
                      start,
                  )

                  if brace < 0:
                      return None

                  start = brace

              try:
                  value, _ = json.JSONDecoder().raw_decode(
                      page[start:]
                  )
                  return value
              except Exception:
                  return None


          def youtube_initial_data(page):
              markers = [
                  "var ytInitialData = ",
                  "window[\"ytInitialData\"] = ",
                  "ytInitialData = ",
              ]

              for marker in markers:
                  value = extract_json_assignment(
                      page,
                      marker,
                  )

                  if isinstance(
                      value,
                      dict,
                  ):
                      return value

              return {}


          def walk_video_renderers(value):
              if isinstance(
                  value,
                  dict,
              ):
                  renderer = value.get(
                      "videoRenderer"
                  )

                  if isinstance(
                      renderer,
                      dict,
                  ):
                      yield renderer

                  for child in value.values():
                      yield from walk_video_renderers(
                          child
                      )

              elif isinstance(
                  value,
                  list,
              ):
                  for child in value:
                      yield from walk_video_renderers(
                          child
                      )


          def text_from_runs(value):
              if not isinstance(
                  value,
                  dict,
              ):
                  return ""

              simple = value.get(
                  "simpleText"
              )

              if isinstance(
                  simple,
                  str,
              ):
                  return simple

              return "".join(
                  str(run.get("text") or "")
                  for run
                  in value.get("runs", [])
                  if isinstance(run, dict)
              ).strip()


          def renderer_channel_id(renderer):
              for key in (
                  "ownerText",
                  "longBylineText",
                  "shortBylineText",
              ):
                  block = renderer.get(
                      key,
                      {}
                  )

                  for run in block.get(
                      "runs",
                      [],
                  ):
                      try:
                          channel_id = (
                              run[
                                  "navigationEndpoint"
                              ][
                                  "browseEndpoint"
                              ][
                                  "browseId"
                              ]
                          )
                      except Exception:
                          channel_id = ""

                      if str(
                          channel_id
                      ).startswith("UC"):
                          return channel_id

              return ""


          def renderer_to_entry(
              renderer,
              assumed_channel_id="",
              source="youtube",
          ):
              video_id = str(
                  renderer.get(
                      "videoId"
                  )
                  or ""
              )

              if not re.fullmatch(
                  r"[A-Za-z0-9_-]{11}",
                  video_id,
              ):
                  return None

              title = text_from_runs(
                  renderer.get(
                      "title",
                      {}
                  )
              )

              published_text = text_from_runs(
                  renderer.get(
                      "publishedTimeText",
                      {}
                  )
              )

              channel_id = (
                  renderer_channel_id(
                      renderer
                  )
                  or
                  assumed_channel_id
              )

              return {
                  "id": video_id,
                  "title": title,
                  "publishedText": published_text,
                  "channelId": channel_id,
                  "source": source,
              }


          # ============================================================
          # OFFICIAL CHANNEL VERIFICATION
          # ============================================================

          def resolve_handle_channel_id(handle):
              url = (
                  "https://www.youtube.com/"
                  + handle
                  + "?hl=en&gl=US"
              )

              page = http_text(url)

              patterns = [
                  r'"channelId":"(UC[A-Za-z0-9_-]{22})"',
                  r'"externalId":"(UC[A-Za-z0-9_-]{22})"',
                  r'"browseId":"(UC[A-Za-z0-9_-]{22})"',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      page,
                  )

                  if match:
                      return match.group(1)

              return ""


          # ============================================================
          # OFFICIAL RSS / ATOM
          #
          # YouTube currently returns 404 for some channels/runners.
          # We still prefer RSS when it is available, then fall back.
          # ============================================================

          def rss_entries(channel_id):
              url = (
                  "https://www.youtube.com/"
                  "feeds/videos.xml?channel_id="
                  + channel_id
              )

              try:
                  xml = http_text(
                      url,
                      timeout=15,
                  )
              except Exception as error:
                  print(
                      "RSS unavailable:",
                      channel_id,
                      error,
                  )
                  return []

              try:
                  root = ET.fromstring(
                      xml
                  )
              except Exception as error:
                  print(
                      "RSS parse warning:",
                      error,
                  )
                  return []

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015",
              }

              output = []

              for item in root.findall(
                  "atom:entry",
                  ns,
              ):
                  video_id = (
                      item.findtext(
                          "yt:videoId",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  title = (
                      item.findtext(
                          "atom:title",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  published = (
                      item.findtext(
                          "atom:published",
                          default="",
                          namespaces=ns,
                      )
                      or ""
                  ).strip()

                  if re.fullmatch(
                      r"[A-Za-z0-9_-]{11}",
                      video_id,
                  ):
                      output.append(
                          {
                              "id": video_id,
                              "title": title,
                              "publishedText": "",
                              "publishedAt": published,
                              "channelId": channel_id,
                              "source": "rss",
                          }
                      )

              return output


          # ============================================================
          # SEARCH YOUTUBE'S NORMAL WEB PAGES
          #
          # This avoids yt-dlp's video-player extraction, which GitHub
          # hosted runners can hit bot checks on.
          # ============================================================

          def youtube_search(
              query,
              official_channel_id,
              handle=None,
          ):
              encoded = urllib.parse.quote_plus(
                  query
              )

              urls = []

              # Search inside the official channel.
              if handle:
                  urls.append(
                      (
                          "https://www.youtube.com/"
                          f"{handle}/search"
                          f"?query={encoded}"
                          "&hl=en&gl=US"
                      )
                  )

              # Global YouTube search sorted by upload date.
              # The official channel ID is checked on every result.
              urls.append(
                  (
                      "https://www.youtube.com/results"
                      f"?search_query={encoded}"
                      "&sp=CAI%253D"
                      "&hl=en&gl=US"
                  )
              )

              # Also try normal relevance sorting because some older
              # program names can disappear from upload-date search.
              urls.append(
                  (
                      "https://www.youtube.com/results"
                      f"?search_query={encoded}"
                      "&hl=en&gl=US"
                  )
              )

              output = []
              seen = set()

              for url in urls:
                  try:
                      page = http_text(
                          url
                      )
                  except Exception as error:
                      print(
                          "Search HTTP warning:",
                          query,
                          error,
                      )
                      continue

                  data = youtube_initial_data(
                      page
                  )

                  for renderer in walk_video_renderers(
                      data
                  ):
                      entry = renderer_to_entry(
                          renderer,
                          assumed_channel_id=(
                              official_channel_id
                              if handle
                              and f"/{handle}/search"
                              in url
                              else ""
                          ),
                          source=(
                              "channel-search"
                              if handle
                              and f"/{handle}/search"
                              in url
                              else "global-search"
                          ),
                      )

                      if not entry:
                          continue

                      # Never accept another channel.
                      if (
                          entry["channelId"]
                          != official_channel_id
                      ):
                          continue

                      if entry["id"] in seen:
                          continue

                      seen.add(
                          entry["id"]
                      )
                      output.append(
                          entry
                      )

              return output


          # ============================================================
          # CHANNEL'S RECENT VIDEOS / STREAMS
          # ============================================================

          def channel_page_entries(
              handle,
              official_channel_id,
              tab,
          ):
              url = (
                  "https://www.youtube.com/"
                  f"{handle}/{tab}"
                  "?hl=en&gl=US"
              )

              try:
                  page = http_text(url)
              except Exception as error:
                  print(
                      "Channel page warning:",
                      handle,
                      tab,
                      error,
                  )
                  return []

              data = youtube_initial_data(
                  page
              )

              output = []
              seen = set()

              for renderer in walk_video_renderers(
                  data
              ):
                  entry = renderer_to_entry(
                      renderer,
                      assumed_channel_id=official_channel_id,
                      source=tab,
                  )

                  if (
                      not entry
                      or
                      entry["id"] in seen
                  ):
                      continue

                  seen.add(
                      entry["id"]
                  )
                  output.append(
                      entry
                  )

              return output


          # ============================================================
          # DATES
          # ============================================================

          def approximate_date_from_text(text):
              """
              YouTube search often exposes relative dates such as
              '2 days ago'. Convert those to an ISO UTC timestamp.
              """
              now = dt.datetime.now(
                  dt.timezone.utc
              )

              value = normalize(
                  text
              )

              value = re.sub(
                  r"^(STREAMED|PREMIERED)\s+",
                  "",
                  value,
              )

              match = re.search(
                  r"\b(\d+)\s+"
                  r"(MINUTE|HOUR|DAY|WEEK|MONTH|YEAR)S?"
                  r"\s+AGO\b",
                  value,
              )

              if match:
                  amount = int(
                      match.group(1)
                  )

                  unit = match.group(2)

                  if unit == "MINUTE":
                      result = now - dt.timedelta(
                          minutes=amount
                      )
                  elif unit == "HOUR":
                      result = now - dt.timedelta(
                          hours=amount
                      )
                  elif unit == "DAY":
                      result = now - dt.timedelta(
                          days=amount
                      )
                  elif unit == "WEEK":
                      result = now - dt.timedelta(
                          weeks=amount
                      )
                  elif unit == "MONTH":
                      result = now - dt.timedelta(
                          days=30 * amount
                      )
                  else:
                      result = now - dt.timedelta(
                          days=365 * amount
                      )

                  return (
                      result.isoformat()
                      .replace(
                          "+00:00",
                          "Z",
                      )
                  )

              if "YESTERDAY" in value:
                  result = now - dt.timedelta(
                      days=1
                  )
                  return (
                      result.isoformat()
                      .replace(
                          "+00:00",
                          "Z",
                      )
                  )

              return ""


          def watch_page_date(video_id):
              """
              Try to read YouTube's public publishDate/uploadDate metadata.
              If the watch page is challenged, return an empty string and
              let the search-result date be used instead.
              """
              url = (
                  "https://www.youtube.com/watch?v="
                  + video_id
                  + "&hl=en&gl=US"
              )

              try:
                  page = http_text(
                      url,
                      timeout=15,
                  )
              except Exception:
                  return ""

              patterns = [
                  r'"publishDate":"(\d{4}-\d{2}-\d{2})"',
                  r'"uploadDate":"(\d{4}-\d{2}-\d{2})"',
                  r'itemprop="datePublished"\s+content="(\d{4}-\d{2}-\d{2})"',
                  r'itemprop="uploadDate"\s+content="(\d{4}-\d{2}-\d{2})"',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      page,
                  )

                  if match:
                      return (
                          match.group(1)
                          + "T00:00:00Z"
                      )

              return ""


          def parse_date(value):
              if not value:
                  return dt.datetime.min.replace(
                      tzinfo=dt.timezone.utc
                  )

              try:
                  parsed = dt.datetime.fromisoformat(
                      value.replace(
                          "Z",
                          "+00:00",
                      )
                  )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(
                          tzinfo=dt.timezone.utc
                      )

                  return parsed

              except Exception:
                  return dt.datetime.min.replace(
                      tzinfo=dt.timezone.utc
                  )


          # ============================================================
          # PREVIOUS DATA
          # ============================================================

          try:
              with open(
                  "data.json",
                  "r",
                  encoding="utf-8",
              ) as file:
                  previous_data = json.load(
                      file
                  )
          except Exception:
              previous_data = {
                  "shows": []
              }


          previous_by_id = {
              item.get("id"): item
              for item
              in previous_data.get(
                  "shows",
                  []
              )
              if item.get("id")
          }


          # ============================================================
          # VERIFY CHANNELS
          # ============================================================

          for key, channel in CHANNELS.items():
              expected = channel[
                  "channelId"
              ]

              try:
                  resolved = (
                      resolve_handle_channel_id(
                          channel["handle"]
                      )
                  )
              except Exception as error:
                  resolved = ""
                  print(
                      "Handle verification warning:",
                      channel["handle"],
                      error,
                  )

              if (
                  resolved
                  and resolved != expected
              ):
                  raise SystemExit(
                      "OFFICIAL CHANNEL ID CHANGED for "
                      + channel["name"]
                      + ": expected "
                      + expected
                      + ", resolved "
                      + resolved
                  )

              print(
                  "OFFICIAL CHANNEL:",
                  channel["name"],
                  expected,
              )


          # ============================================================
          # CACHE CHANNEL DATA
          # ============================================================

          rss_cache = {}
          videos_cache = {}
          streams_cache = {}


          for key, channel in CHANNELS.items():
              channel_id = channel[
                  "channelId"
              ]

              rss_cache[key] = (
                  rss_entries(
                      channel_id
                  )
              )

              videos_cache[key] = (
                  channel_page_entries(
                      channel["handle"],
                      channel_id,
                      "videos",
                  )
              )

              streams_cache[key] = (
                  channel_page_entries(
                      channel["handle"],
                      channel_id,
                      "streams",
                  )
              )

              print(
                  channel["name"],
                  "| RSS:",
                  len(
                      rss_cache[key]
                  ),
                  "| videos:",
                  len(
                      videos_cache[key]
                  ),
                  "| streams:",
                  len(
                      streams_cache[key]
                  ),
              )


          # ============================================================
          # FIND EACH PROGRAM
          # ============================================================

          final_shows = []


          for show in SHOWS:
              channel = CHANNELS[
                  show["channel"]
              ]

              official_channel_id = channel[
                  "channelId"
              ]

              candidates = []
              seen = set()


              def add_candidates(items):
                  for item in items:
                      video_id = (
                          item.get("id")
                          or ""
                      )

                      if (
                          not video_id
                          or video_id in seen
                      ):
                          continue

                      if (
                          item.get("channelId")
                          != official_channel_id
                      ):
                          continue

                      if not title_matches(
                          show,
                          item.get(
                              "title",
                              "",
                          ),
                      ):
                          continue

                      seen.add(
                          video_id
                      )
                      candidates.append(
                          dict(item)
                      )


              # 1) Official Atom feed, if YouTube exposes it.
              add_candidates(
                  rss_cache[
                      show["channel"]
                  ]
              )

              # 2) Current channel videos/streams pages.
              add_candidates(
                  videos_cache[
                      show["channel"]
                  ]
              )

              add_candidates(
                  streams_cache[
                      show["channel"]
                  ]
              )

              # 3) Search the official channel + date-sorted YouTube.
              for query in show[
                  "queries"
              ]:
                  add_candidates(
                      youtube_search(
                          query,
                          official_channel_id,
                          handle=channel[
                              "handle"
                          ],
                      )
                  )


              # Obtain the best public date we can for every match.
              for candidate in candidates:
                  if candidate.get(
                      "publishedAt"
                  ):
                      continue

                  exact_date = (
                      watch_page_date(
                          candidate["id"]
                      )
                  )

                  if exact_date:
                      candidate[
                          "publishedAt"
                      ] = exact_date

                  else:
                      candidate[
                          "publishedAt"
                      ] = (
                          approximate_date_from_text(
                              candidate.get(
                                  "publishedText",
                                  "",
                              )
                          )
                      )


              newest = None

              if candidates:
                  newest = max(
                      candidates,
                      key=lambda item: (
                          parse_date(
                              item.get(
                                  "publishedAt",
                                  "",
                              )
                          ),
                          item.get(
                              "source",
                              "",
                          ),
                      ),
                  )


              previous = (
                  previous_by_id.get(
                      show["id"]
                  )
                  or {}
              )

              previous_valid = (
                  previous.get(
                      "found"
                  )
                  is True
                  and bool(
                      previous.get(
                          "videoId"
                      )
                  )
              )


              # Never replace a known newer valid episode
              # with an older search result.
              if (
                  newest
                  and previous_valid
              ):
                  old_date = parse_date(
                      previous.get(
                          "publishedAt",
                          "",
                      )
                  )

                  new_date = parse_date(
                      newest.get(
                          "publishedAt",
                          "",
                      )
                  )

                  if old_date > new_date:
                      newest = None


              if newest:
                  video_id = newest[
                      "id"
                  ]

                  entry = {
                      "id": show["id"],
                      "section": show[
                          "section"
                      ],
                      "label": show[
                          "label"
                      ],
                      "found": True,
                      "videoId": video_id,
                      "thumbnail": (
                          "https://i.ytimg.com/vi/"
                          + video_id
                          + "/hqdefault.jpg"
                      ),
                      "embedUrl": (
                          "https://www.youtube-nocookie.com/embed/"
                          + video_id
                          + "?autoplay=1&rel=0&playsinline=1"
                      ),
                      "watchUrl": (
                          "https://www.youtube.com/watch?v="
                          + video_id
                      ),
                      "videoTitle": newest.get(
                          "title",
                          "",
                      ),
                      "publishedAt": newest.get(
                          "publishedAt",
                          "",
                      ),
                  }

                  final_shows.append(
                      entry
                  )

                  print(
                      "FOUND |",
                      show["label"],
                      "|",
                      video_id,
                      "|",
                      entry[
                          "publishedAt"
                      ],
                      "|",
                      entry[
                          "videoTitle"
                      ],
                  )

                  continue


              if previous_valid:
                  kept = dict(
                      previous
                  )

                  kept["section"] = show[
                      "section"
                  ]

                  kept["label"] = show[
                      "label"
                  ]

                  final_shows.append(
                      kept
                  )

                  print(
                      "PRESERVED |",
                      show["label"],
                      "|",
                      kept.get(
                          "videoId"
                      ),
                  )

                  continue


              final_shows.append(
                  {
                      "id": show["id"],
                      "section": show[
                          "section"
                      ],
                      "label": show[
                          "label"
                      ],
                      "found": False,
                      "videoId": "",
                      "thumbnail": "",
                      "embedUrl": "",
                      "watchUrl": "",
                      "videoTitle": "",
                      "publishedAt": "",
                  }
              )

              print(
                  "MISSING |",
                  show["label"],
              )


          # ============================================================
          # WRITE DATA.JSON
          # ============================================================

          output = {
              "generatedAt": (
                  dt.datetime.now(
                      dt.timezone.utc
                  )
                  .isoformat()
                  .replace(
                      "+00:00",
                      "Z",
                  )
              ),

              "channels": {
                  "EQUINOXE TV": {
                      "name": CHANNELS[
                          "equinoxe"
                      ][
                          "name"
                      ],
                      "handle": CHANNELS[
                          "equinoxe"
                      ][
                          "handle"
                      ],
                      "channelId": CHANNELS[
                          "equinoxe"
                      ][
                          "channelId"
                      ],
                  },

                  "CANAL 2": {
                      "name": CHANNELS[
                          "canal2"
                      ][
                          "name"
                      ],
                      "handle": CHANNELS[
                          "canal2"
                      ][
                          "handle"
                      ],
                      "channelId": CHANNELS[
                          "canal2"
                      ][
                          "channelId"
                      ],
                  },

                  "INFO TV": {
                      "name": CHANNELS[
                          "infotv"
                      ][
                          "name"
                      ],
                      "handle": CHANNELS[
                          "infotv"
                      ][
                          "handle"
                      ],
                      "channelId": CHANNELS[
                          "infotv"
                      ][
                          "channelId"
                      ],
                  },
              },

              "shows": final_shows,
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

              file.write(
                  "\n"
              )


          found_count = sum(
              1
              for item in final_shows
              if item.get(
                  "found"
              )
          )

          print()
          print(
              "TV FACILE RESULT:",
              f"{found_count}/17 available",
          )
          PY

      - name: Validate data structure
        shell: bash
        run: |
          python <<'PY'
          import json
          import re

          with open(
              "data.json",
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(
                  file
              )

          shows = data.get(
              "shows",
              []
          )

          if len(shows) != 17:
              raise SystemExit(
                  f"Expected 17 programs; found {len(shows)}."
              )

          seen = set()

          for show in shows:
              show_id = show.get(
                  "id"
              )

              if (
                  not show_id
                  or show_id in seen
              ):
                  raise SystemExit(
                      f"Invalid/duplicate show ID: {show_id!r}"
                  )

              seen.add(
                  show_id
              )

              if not show.get(
                  "found"
              ):
                  continue

              video_id = show.get(
                  "videoId",
                  "",
              )

              if not re.fullmatch(
                  r"[A-Za-z0-9_-]{11}",
                  video_id,
              ):
                  raise SystemExit(
                      f"Bad video ID for {show_id}: {video_id}"
                  )

              if show.get(
                  "thumbnail"
              ) != (
                  "https://i.ytimg.com/vi/"
                  + video_id
                  + "/hqdefault.jpg"
              ):
                  raise SystemExit(
                      f"Bad thumbnail for {show_id}"
                  )

              if not show.get(
                  "embedUrl",
                  "",
              ).startswith(
                  "https://www.youtube-nocookie.com/embed/"
                  + video_id
              ):
                  raise SystemExit(
                      f"Bad embed URL for {show_id}"
                  )

              if show.get(
                  "watchUrl"
              ) != (
                  "https://www.youtube.com/watch?v="
                  + video_id
              ):
                  raise SystemExit(
                      f"Bad watch URL for {show_id}"
                  )

          found = sum(
              bool(show.get("found"))
              for show in shows
          )

          print(
              f"Validated {found}/17 available programs."
          )
          PY

