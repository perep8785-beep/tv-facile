                  ],

                  "query":
                      "DEBRIEF INFO TV CAMEROUN"
              }
          ]


          # ============================================================
          # TEXT NORMALIZATION
          # ============================================================

          def normalize(value):

              value = value or ""

              value = unicodedata.normalize(
                  "NFKD",
                  value
              )

              value = "".join(
                  character
                  for character in value
                  if not unicodedata.combining(
                      character
                  )
              )

              value = (
                  value
                  .upper()
                  .replace("’", "'")
                  .replace("–", "-")
                  .replace("—", "-")
              )

              value = re.sub(
                  r"[^A-Z0-9]+",
                  " ",
                  value
              )

              return re.sub(
                  r"\s+",
                  " ",
                  value
              ).strip()


          # ============================================================
          # YT-DLP
          # ============================================================

          BASE_YDL_OPTIONS = {

              "quiet": True,

              "no_warnings": True,

              "skip_download": True,

              "ignoreerrors": True,

              "socket_timeout": 30,

              "extractor_args": {
                  "youtube": {
                      "player_client": [
                          "web"
                      ]
                  }
              }
          }


          def ytdlp_extract(
              url,
              flat=False
          ):

              options = dict(
                  BASE_YDL_OPTIONS
              )

              if flat:
                  options[
                      "extract_flat"
                  ] = "in_playlist"

              with YoutubeDL(
                  options
              ) as ydl:

                  return ydl.extract_info(
                      url,
                      download=False
                  )


          # ============================================================
          # CHANNEL ID RESOLUTION
          # ============================================================

          def resolve_channel_id(
              handle
          ):

              url = (
                  "https://www.youtube.com/" +
                  handle +
                  "/videos"
              )

              try:
                  info =
                      ytdlp_extract(
                          url,
                          flat=True
                      )

                  channel_id = (
                      info.get(
                          "channel_id"
                      )
                      or
                      info.get(
                          "uploader_id"
                      )
                  )

                  if (
                      channel_id and
                      str(
                          channel_id
                      ).startswith("UC")
                  ):
                      return channel_id

              except Exception as error:
                  print(
                      "yt-dlp channel resolution failed:",
                      handle,
                      error
                  )

              /*
              Python does not support JS comments.
              */

          PY
